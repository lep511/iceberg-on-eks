# Enables S3 Metadata on the warehouse bucket: journal table (records expire after 7 days)
# and live inventory table, both SSE-S3, in the AWS managed table bucket "aws-s3".
# Runs in the cluster because the IDE role cannot create S3 Metadata configurations; the IRSA
# role can. The annotation table stays DISABLED: it needs an IAM role that S3 assumes, which
# this action does not pass (no iam:PassRole). Run it once: a second run fails while the
# configuration exists. The inventory table backfills existing objects before it becomes
# ACTIVE (minutes to hours, billed); check with job-s3-metadata-status.yaml.
#
# Render with scripts/render-manifests.sh, then run it and print the response (waits until
# the Job completes or fails):
#   scripts/run-job.sh build/manifests/rust/job-s3-metadata-enable.yaml
apiVersion: batch/v1
kind: Job
metadata:
  # generateName gives every run a unique name: create it with `kubectl create -f`
  # (`kubectl apply` does not support generateName).
  generateName: iceberg-k8s-s3-metadata-enable-
  namespace: <JOBS_NAMESPACE>
  labels:
    app.kubernetes.io/name: iceberg-k8s
    app.kubernetes.io/component: s3-metadata-enable
    app.kubernetes.io/part-of: spark-on-eks-iceberg
spec:
  # No retries: a retry fails anyway once the configuration exists.
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        # Keep Auto Mode consolidation from evicting the pod mid-run.
        karpenter.sh/do-not-disrupt: "true"
      labels:
        app.kubernetes.io/name: iceberg-k8s
        app.kubernetes.io/component: s3-metadata-enable
        app.kubernetes.io/part-of: spark-on-eks-iceberg
    spec:
      # IRSA: the service account is annotated with the project's IRSA role.
      serviceAccountName: <JOBS_SERVICE_ACCOUNT>
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
        karpenter.sh/capacity-type: on-demand
        NodeGroupType: general-purpose
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Makes the projected IRSA token readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      initContainers:
        # Downloads the CLI (built by rust/build.sh, uploaded by scripts/upload-artifacts.sh).
        - name: fetch
          image: public.ecr.aws/aws-cli/aws-cli:2.39.5
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              aws s3 cp --only-show-errors "s3://<WAREHOUSE_BUCKET>/lab/bin/iceberg-k8s" /work/iceberg-k8s
              chmod 0755 /work/iceberg-k8s
              ls -l /work
          env:
            - name: AWS_REGION
              value: <REGION>
            # The AWS CLI keeps its cache under $HOME; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      containers:
        - name: iceberg-k8s
          # glibc 2.34 (same as the AL2023 build host), CA bundle in /etc/pki/tls/certs.
          image: public.ecr.aws/amazonlinux/amazonlinux:2023.12.20261102.0-minimal
          command: ["/work/iceberg-k8s"]
          args:
            - "--request-json"
            - "{\"action\":\"create_metadata_config\",\"metadata_config\":{\"journal_expiration\":\"ENABLED\",\"journal_expiration_days\":7,\"inventory_enabled\":\"ENABLED\",\"annotation_enabled\":\"DISABLED\"}}"
            - "--bucket"
            - "<WAREHOUSE_BUCKET>"
          env:
            - name: ICEBERG_WAREHOUSE
              value: <ICEBERG_WAREHOUSE>
            - name: AWS_REGION
              value: <REGION>
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: work
              mountPath: /work
              readOnly: true
